<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Health Chaska | Fresh & Healthy</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f6f7f9;color:#202124}
header{position:sticky;top:0;z-index:10;background:#fff;padding:12px 16px;border-bottom:1px solid #eee}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.logo{font-size:23px;font-weight:800;color:#0b7a3b}.sub{font-size:12px;color:#666;margin-top:2px}
.location{font-size:12px;color:#444;cursor:pointer}.location b{color:#111}
.search{margin-top:12px;background:#f1f3f5;border-radius:12px;padding:11px 13px;display:flex;gap:8px}.search input{border:0;background:transparent;outline:0;width:100%;font-size:15px}
.hero{margin:14px 12px;background:linear-gradient(135deg,#dff8e8,#fff);border-radius:18px;padding:18px}.hero h1{margin:0 0 5px;font-size:24px}.hero p{margin:0;color:#555}.hero button{margin-top:12px;border:0;background:#0b7a3b;color:#fff;border-radius:10px;padding:10px 15px;font-weight:700}
.wrap{padding:0 12px}.cats{display:flex;gap:10px;overflow:auto;padding:5px 0 15px}.cat{min-width:92px;background:#fff;border:1px solid #eee;border-radius:12px;padding:10px;text-align:center;font-size:13px}.cat span{font-size:25px;display:block;margin-bottom:4px}
h2{font-size:19px;margin:8px 0 12px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{background:#fff;border-radius:15px;padding:10px;box-shadow:0 1px 5px #ddd}.pic{height:125px;border-radius:12px;background:#eef8f1;display:flex;align-items:center;justify-content:center;font-size:58px}.name{font-weight:700;margin-top:9px}.desc{font-size:11px;color:#777;min-height:30px;margin-top:4px}.row{display:flex;align-items:center;justify-content:space-between;margin-top:8px}.price{font-weight:800}.add{border:1px solid #0b7a3b;background:#fff;color:#0b7a3b;border-radius:8px;padding:7px 12px;font-weight:800}.qty{display:flex;align-items:center;gap:10px;border:1px solid #0b7a3b;border-radius:8px;padding:5px 8px;color:#0b7a3b;font-weight:800}.qty button{border:0;background:none;color:#0b7a3b;font-size:18px;font-weight:bold}
.cart{position:fixed;bottom:14px;left:12px;right:12px;background:#0b7a3b;color:#fff;border-radius:14px;padding:13px 16px;display:none;align-items:center;justify-content:space-between;box-shadow:0 5px 18px #999}.cart button{border:0;background:#fff;color:#0b7a3b;border-radius:9px;padding:9px 13px;font-weight:800}
.modal{display:none;position:fixed;inset:0;background:#0008;z-index:30;align-items:flex-end}.sheet{background:#fff;width:100%;max-height:88vh;border-radius:20px 20px 0 0;padding:18px;overflow:auto}.close{float:right;border:0;background:#eee;border-radius:50%;width:32px;height:32px}.line{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee}.checkout{width:100%;padding:13px;background:#0b7a3b;color:#fff;border:0;border-radius:10px;font-weight:800;margin-top:14px}.details-title{font-size:16px;font-weight:800;margin-top:18px}.field{width:100%;padding:12px;border:1px solid #ddd;border-radius:9px;margin-top:8px;font-size:14px}.field:focus{outline:2px solid #b9e8cb;border-color:#0b7a3b}
input.addr{width:100%;padding:12px;border:1px solid #ddd;border-radius:9px;margin-top:8px}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}.hero,.wrap{max-width:1050px;margin-left:auto;margin-right:auto}}
</style>
</head>
<body>
<header>
  <div class="top">
    <div><div class="logo">🥗 Health Chaska</div><div class="sub">Fresh • Healthy • Fast</div></div>
    <div class="location" onclick="setLocation()">📍 <b id="loc">Select location</b><br>Deliver here</div>
  </div>
  <div class="search">🔎 <input id="search" placeholder="Search bowls, sandwich..." oninput="render()"></div>
</header>

<section class="hero">
  <h1>Healthy food, delivered fresh 🥗</h1>
  <p>11 fresh & healthy choices • Fast local delivery</p>
  <button onclick="document.getElementById('products').scrollIntoView()">Order now</button>
</section>

<div class="wrap">
  <div class="cats">
    <div class="cat" onclick="filter('all')"><span>🍽️</span>All</div>
    <div class="cat" onclick="filter('bowl')"><span>🥗</span>Bowls</div>
    <div class="cat" onclick="filter('snack')"><span>🥪</span>Sandwich</div>
    <div class="cat" onclick="filter('healthy')"><span>🌱</span>Healthy</div>
  </div>
  <h2>Popular near you</h2>
  <div id="products" class="grid"></div>
</div>

<div id="cartbar" class="cart"><span><b id="count">0</b> items • ₹<b id="total">0</b></span><button onclick="openCart()">View cart →</button></div>

<div id="modal" class="modal" onclick="if(event.target===this)closeCart()">
 <div class="sheet">
  <button class="close" onclick="closeCart()">✕</button>
  <h2>Your Cart</h2>
  <div id="cartitems"></div>
  <div class="line"><b>Total</b><b>₹<span id="carttotal">0</span></b></div>
  <div class="details-title">Customer Details</div>
  <input class="field" id="custname" placeholder="Full name">
  <input class="field" id="plot" placeholder="Plot / House No.">
  <input class="field" id="address" placeholder="Full delivery address">
  <input class="field" id="area" placeholder="Area / Colony">
  <input class="field" id="mobile" type="tel" inputmode="numeric" maxlength="10" placeholder="Mobile number">
  <button class="checkout" onclick="placeOrder()">Place Order on WhatsApp</button>
 </div>
</div>

<script>
const products=[
 {id:1,name:"Simple Salad Bowl",price:39,cat:"healthy",emoji:"🥗",desc:"Cucumber, carrot, tomato, onion, peanuts, pomegranate, lemon & black salt"},
 {id:2,name:"Simple Peanut Butter Sandwich",price:49,cat:"snack",emoji:"🥪",desc:"Bread, peanut butter, banana, seeds, raisins, pomegranate, honey & chocolate sauce"},
 {id:3,name:"Sprouts Bowl",price:59,cat:"bowl",emoji:"🌱",desc:"Moong, chana, moth, rajma, tomato, cucumber, onion, peanuts, pomegranate, raisins & lemon"},
 {id:4,name:"Banana Oats Bowl",price:69,cat:"bowl",emoji:"🍌",desc:"Oats, milk, banana, flax, pumpkin & sunflower seeds, peanuts, pomegranate, raisins, peanut butter & honey"},
 {id:5,name:"Apple Oats Bowl",price:79,cat:"bowl",emoji:"🍎",desc:"Oats, milk, apple, flax, pumpkin & sunflower seeds, peanuts, pomegranate, raisins, peanut butter & honey"},
 {id:6,name:"Banana Chia Seeds Bowl",price:69,cat:"bowl",emoji:"🥣",desc:"Chia seeds, milk, banana, flax, pumpkin & sunflower seeds, peanuts, pomegranate, raisins, peanut butter & honey"},
 {id:7,name:"Apple Chia Seeds Bowl",price:79,cat:"bowl",emoji:"🍎",desc:"Chia seeds, milk, apple, flax, pumpkin & sunflower seeds, peanuts, pomegranate, raisins, peanut butter & honey"},
 {id:8,name:"Banana Oats & Chia Seeds Bowl",price:89,cat:"bowl",emoji:"🍌",desc:"Chia seeds, oats, milk, banana, flax, pumpkin & sunflower seeds, peanuts, pomegranate, raisins, peanut butter & honey"},
 {id:9,name:"Apple Oats & Chia Seeds Bowl",price:99,cat:"bowl",emoji:"🍎",desc:"Chia seeds, oats, milk, apple, flax, pumpkin & sunflower seeds, peanuts, pomegranate, raisins, peanut butter & honey"},
 {id:10,name:"Apple & Banana Oats + Chia Seeds Bowl",price:120,cat:"bowl",emoji:"🍎🍌",desc:"Chia seeds, oats, milk, apple, banana, flax, pumpkin & sunflower seeds, peanuts, pomegranate, raisins, peanut butter & honey"},
 {id:11,name:"3-Layer Peanut Butter Sandwich",price:99,cat:"snack",emoji:"🥪",desc:"Bread, peanut butter, banana, apple, flax, oats, pumpkin & sunflower seeds, chia, raisins, peanuts, pomegranate, honey & chocolate sauce"}
];
let cart={}, current="all";
function filter(c){current=c;render()}
function render(){
 const q=document.getElementById("search").value.toLowerCase();
 const box=document.getElementById("products");
 box.innerHTML="";
 products.filter(p=>(current==="all"||p.cat===current)&&p.name.toLowerCase().includes(q)).forEach(p=>{
  const n=cart[p.id]||0;
  box.innerHTML+=`<div class="card"><div class="pic">${p.emoji}</div><div class="name">${p.name}</div><div class="desc">${p.desc}</div><div class="row"><span class="price">₹${p.price}</span>${n?`<div class="qty"><button onclick="change(${p.id},-1)">−</button>${n}<button onclick="change(${p.id},1)">+</button></div>`:`<button class="add" onclick="change(${p.id},1)">ADD</button>`}</div></div>`;
 });
 updateBar();
}
function change(id,d){cart[id]=(cart[id]||0)+d;if(cart[id]<=0)delete cart[id];render()}
function updateBar(){
 let c=0,t=0;Object.entries(cart).forEach(([id,n])=>{c+=n;t+=products.find(p=>p.id==id).price*n});
 document.getElementById("count").textContent=c;document.getElementById("total").textContent=t;
 document.getElementById("cartbar").style.display=c?"flex":"none";
}
function openCart(){
 let box=document.getElementById("cartitems"),t=0;box.innerHTML="";
 Object.entries(cart).forEach(([id,n])=>{let p=products.find(x=>x.id==id),s=p.price*n;t+=s;box.innerHTML+=`<div class="line"><span>${p.name} × ${n}</span><b>₹${s}</b></div>`});
 document.getElementById("carttotal").textContent=t;document.getElementById("modal").style.display="flex";
}
function closeCart(){document.getElementById("modal").style.display="none"}
function placeOrder(){
 let name=document.getElementById("custname").value.trim();
 let plot=document.getElementById("plot").value.trim();
 let a=document.getElementById("address").value.trim();
 let area=document.getElementById("area").value.trim();
 let mobile=document.getElementById("mobile").value.trim();
 if(!name||!plot||!a||!mobile)return alert("Please fill Name, Plot/House No., Address and Mobile number.");
 if(!/^[0-9]{10}$/.test(mobile))return alert("Please enter a valid 10-digit mobile number.");
 let msg="Health Chaska Order\n\nCustomer: "+name+"\nPlot/House No.: "+plot+"\nAddress: "+a+"\nArea: "+area+"\nMobile: "+mobile+"\n\nItems:\n";
 Object.entries(cart).forEach(([id,n])=>{let p=products.find(x=>x.id==id);msg+=`${p.name} x ${n} = ₹${p.price*n}\n`});
 let total=Object.entries(cart).reduce((s,[id,n])=>s+products.find(p=>p.id==id).price*n,0);
 msg+="\nTotal: ₹"+total;
 window.open("https://wa.me/?text="+encodeURIComponent(msg),"_blank");
}
function setLocation(){let l=prompt("Enter your delivery area/location:");if(l)document.getElementById("loc").textContent=l}
render();
</script>
</body>
</html>
